<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Shopping List">
<meta name="description" content="Simple grocery shopping list with check-off and clear-checked. Glanceable on Meta Ray-Ban Display.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Shopping List</title>
<style>
:root{--accent:#4ADE80;--bg:#0B0F14;--card:#161C26;--line:#2A3442;--text:#F3F6FA;--dim:#9AA6B6;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{width:min(480px,100vw - 24px);height:100dvh;max-height:780px;display:flex;flex-direction:column;padding:16px 14px 12px;background:var(--bg);border-radius:18px;gap:10px}
h1{font-size:20px;text-align:center}
.sub{font-size:14px;color:var(--dim);text-align:center}
.sub b{color:var(--accent)}
.form{display:flex;gap:6px}
input{min-height:48px;flex:1;min-width:0;font-size:16px;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;-webkit-user-select:text;user-select:text}
input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{min-height:48px;font-size:16px;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;padding:0 14px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.98)}
#addBtn{background:var(--accent);border-color:var(--accent);color:#101418;font-weight:700}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.row{display:flex;gap:6px;align-items:stretch}
.row .tog{flex:1;display:flex;align-items:center;gap:10px;padding:6px 12px;text-align:left;font-size:17px}
.row .box{flex:0 0 22px;height:22px;border:2px solid var(--dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#101418}
.row .tog.done .box{background:var(--accent);border-color:var(--accent)}
.row .tog.done .txt{text-decoration:line-through;color:var(--dim)}
.row .tog.done{opacity:.6}
.row .del{flex:0 0 52px;font-size:18px;color:#F87171}
#clearBtn{border-color:#7F2E2E;color:#FCA5A5;font-weight:700}
#clearBtn.armed{background:#7F1D1D;border-color:#EF4444;color:#fff}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:20px 0}
</style>
</head>
<body>
<div class="app">
  <h1>&#x1F6D2; Shopping List</h1>
  <div class="sub" id="countLine"><b>0</b> of <b>0</b> done</div>
  <div class="form">
    <input id="itemInput" data-focusable type="text" placeholder="Add item" autocomplete="off">
    <button id="addBtn" data-focusable>Add</button>
  </div>
  <div class="scroll" id="list"></div>
  <button id="clearBtn" data-focusable>Clear checked</button>
</div>
<script>
(function(){
"use strict";
var KEY="shopping-list-v1";
function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){ var a=JSON.parse(s); if(Array.isArray(a)) return a; }
  }catch(e){}
  return [];
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); }catch(e){} }
var items=load();
var listEl=document.getElementById("list");
var inputEl=document.getElementById("itemInput");
var countEl=document.getElementById("countLine");
var clearBtn=document.getElementById("clearBtn");
var clearArmed=false;
var clearTimer=null;
var focusables=[];
var focusPos=0;

function disarmClear(){
  clearArmed=false;
  clearBtn.classList.remove("armed");
  clearBtn.textContent="Clear checked";
  if(clearTimer){ clearTimeout(clearTimer); clearTimer=null; }
}
function addItem(){
  var t=inputEl.value.trim();
  if(!t) return;
  items.push({t:t,done:false});
  save();
  inputEl.value="";
  disarmClear(); render();
  inputEl.focus();
}
function toggleItem(i){
  if(items[i]){ items[i].done=!items[i].done; save(); render(); }
}
function delItem(i){
  items.splice(i,1);
  save(); disarmClear(); render();
}
function clearChecked(){
  if(!clearArmed){
    clearArmed=true;
    clearBtn.classList.add("armed");
    clearBtn.textContent="Tap again to confirm";
    clearTimer=setTimeout(disarmClear,4000);
    return;
  }
  items=items.filter(function(it){ return !it.done; });
  save(); disarmClear(); render();
}
function render(){
  var done=items.filter(function(it){ return it.done; }).length;
  countEl.innerHTML="<b>"+done+"</b> of <b>"+items.length+"</b> done";
  listEl.innerHTML="";
  if(!items.length){
    var d=document.createElement("div"); d.className="empty"; d.textContent="List is empty. Add items above.";
    listEl.appendChild(d);
  }
  items.forEach(function(it,i){
    var row=document.createElement("div"); row.className="row";
    var tog=document.createElement("button");
    tog.className="tog"+(it.done?" done":"");
    tog.setAttribute("data-focusable","");
    var box=document.createElement("span"); box.className="box"; box.textContent=it.done?"\u2713":"";
    var txt=document.createElement("span"); txt.className="txt"; txt.textContent=it.t;
    tog.appendChild(box); tog.appendChild(txt);
    tog.addEventListener("click",function(){ toggleItem(i); });
    var del=document.createElement("button");
    del.className="del"; del.textContent="\u2715"; del.setAttribute("data-focusable","");
    del.setAttribute("aria-label","Delete "+it.t);
    del.addEventListener("click",function(){ delItem(i); });
    row.appendChild(tog); row.appendChild(del);
    listEl.appendChild(row);
  });
  refreshFocusables();
}
function refreshFocusables(){
  focusables=Array.prototype.slice.call(document.querySelectorAll("[data-focusable]"));
}
function moveFocus(d){
  if(!focusables.length) return;
  focusPos=((focusPos+d)%focusables.length+focusables.length)%focusables.length;
  focusables[focusPos].focus();
}
document.getElementById("addBtn").addEventListener("click",addItem);
inputEl.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); addItem(); } });
clearBtn.addEventListener("click",clearChecked);
document.addEventListener("keydown",function(e){
  if(e.target===inputEl) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); moveFocus(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); moveFocus(-1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); moveFocus(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveFocus(-1); }
});
document.addEventListener("focusin",function(e){
  var i=focusables.indexOf(e.target);
  if(i>=0) focusPos=i;
});
render();
})();
</script>
</body>
</html>
